[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "petex-mcp-server"
version = "1.0.0"
description = "MCP server for PETEX petroleum engineering tools (PROSPER, MBAL, GAP) via OpenServer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "pywin32>=306",
    "xhtml2pdf>=0.2.11",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
petex-mcp = "petex_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["petex_mcp"]
